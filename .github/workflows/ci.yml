name: CI

on:
  pull_request:
  push:

jobs:
  tardigrade-formula:
    name: Tardigrade formula
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Validate formula syntax
        run: ruby -c Formula/tardigrade.rb

      - name: Tap local checkout
        run: brew tap Bare-Systems/tap "$GITHUB_WORKSPACE"

      - name: Audit formula
        run: brew audit --formula Bare-Systems/tap/tardigrade

      - name: Install formula
        run: brew install Bare-Systems/tap/tardigrade

      - name: Verify installed commands
        run: |
          command -v tardi
          command -v tardigrade
          tardi version
          tardigrade version

      - name: Verify native dependency contract
        run: |
          linked="$(ldd "$(command -v tardi)")"
          printf '%s\n' "$linked"
          ! printf '%s\n' "$linked" | grep -E 'lib(ssl|crypto)\.so'

      - name: Run Homebrew test
        run: brew test Bare-Systems/tap/tardigrade
